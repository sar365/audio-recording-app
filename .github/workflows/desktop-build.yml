name: Desktop app builds

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  package:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux x64
            runner: ubuntu-24.04
            script: desktop:linux
            artifact: linux-x64
          - platform: Windows x64
            runner: windows-latest
            script: desktop:win
            artifact: windows-x64
          - platform: macOS Intel and Apple silicon
            runner: macos-latest
            script: desktop:mac
            artifact: macos-x64-arm64
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Package desktop app
        run: pnpm ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload Linux installers
        if: matrix.platform == 'Linux x64'
        uses: actions/upload-artifact@v4
        with:
          name: dj-companion-${{ matrix.artifact }}
          path: |
            release/*.AppImage
            release/*.deb
          if-no-files-found: error
          retention-days: 30

      - name: Upload Windows installer
        if: matrix.platform == 'Windows x64'
        uses: actions/upload-artifact@v4
        with:
          name: dj-companion-${{ matrix.artifact }}
          path: release/*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Upload macOS installers
        if: matrix.platform == 'macOS Intel and Apple silicon'
        uses: actions/upload-artifact@v4
        with:
          name: dj-companion-${{ matrix.artifact }}
          path: |
            release/*.dmg
            release/*.zip
          if-no-files-found: error
          retention-days: 30
